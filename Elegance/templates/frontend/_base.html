{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Elegance{% endblock %} — ELEGANCE</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="{% static 'images/elegance-logo.png' %}">

  <link rel="stylesheet" href="{% static 'css/site.css' %}" />
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

{% include "frontend/includes/header.html" %}

{% block content %}{% endblock %}

{% include "frontend/includes/footer.html" %}

<div id="e-toast-stack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/api_caller.js' %}"></script>
<script src="{% static 'js/frontend_utils.js' %}"></script>
<script>window.ELEGANCE_CART_API_URL = "{% url 'cart-api-list' %}";</script>
<script src="{% static 'js/site.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
