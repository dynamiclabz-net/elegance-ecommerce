<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="display:inline-block;margin:4px 6px 4px 0;">
  <tr>
    {% if outline %}
    <td align="center" style="border:1.5px solid {{ color|default:'#b8860b' }};border-radius:6px;background-color:#FFFFFF;">
      <a href="{{ url }}" style="display:inline-block;padding:12px 24px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:{{ color|default:'#b8860b' }};text-decoration:none;border-radius:6px;">{{ label }}</a>
    </td>
    {% else %}
    <td align="center" bgcolor="{{ color|default:'#b8860b' }}" style="background-color:{{ color|default:'#b8860b' }};border-radius:6px;">
      <a href="{{ url }}" style="display:inline-block;padding:13px 26px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#FFFFFF;text-decoration:none;border-radius:6px;">{{ label }}</a>
    </td>
    {% endif %}
  </tr>
</table>
